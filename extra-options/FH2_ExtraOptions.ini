// Forza Horizon 2 Extra Options
// Release v0.3.9, compatible with Azimuth 1.0.1 to 1.0.3
// by Arthur (RokkuDayo): https://github.com/RokkuDayo/ForzaHorizon2_ExtraOptions
// Fork by Bullet4fun for the Azimuth Mod Loader: https://github.com/Bullet4fun/FH2_ModsCollection
//
// Read at game startup. A key left out keeps its default.
// Graphics, camera and HUD values are set in-game and saved to FH2_ExtraOptions.dat; the switches here decide
// whether those features exist at all: a feature switched off here is gone from the game's menus and its saved value is ignored.

[Global]
Enabled = 1                        // Turns every feature of the mod on or off. (0 = Off, 1 = On (Default))

[Content]
UnlockDLC = 1                      // Grants all DLC entitlements. Storm Island's map needs its DLC package mounted; its cars work regardless. (0 = Off, 1 = On (Default))
OfflineVIP = 1                     // Grants VIP status: double credits, XP and wheelspin bonuses. (0 = Off, 1 = On (Default))
UnlockTreasureMap = 0              // Reveals all bonus boards and barns (mainland and Storm Island) and lists the Treasure Map in Marketplace > Extras offline. Boards found while on stay found after a save. (0 = Off (Default), 1 = On)
UnlockStormIslandCars = 1          // Lets you buy the Ranger T6 and #7 SST without the Storm Island events. (0 = Off, 1 = On (Default))

[Frontend]
SkipIntro = 1                      // Boots straight into the "Press Start" menu. (0 = Off, 1 = On (Default))
CarsNextToHome = 1                 // Puts the Cars tab right after Home in the pause menu. Restart after changing. (0 = Off, 1 = On (Default))
MenuTurboIntervalMs = 100          // Holding LB/RB for half a second repeats the tap every this many ms. 20-1000, lower is faster, 0 turns it off. Restart after changing. (Default 100)
GetInCarFromPauseMenu = 1          // "Get In Car" in free roam: pick any car in the pause menu's My Cars. (0 = Off, 1 = On (Default))
ReturnToGarage = 1                 // The "Return to Garage" button in the pause menu. (0 = Off, 1 = On (Default))
AllRimsCategory = 0                // Adds combined aftermarket and stock rim categories after the three stock ones. The game database is not changed. (0 = Off (Default), 1 = On)
EnableMarketplace = 1              // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
EnableSocial = 1                   // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
EnableClubs = 1                    // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
EnableRivals = 1                   // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
InGameOptions = 1                  // The mod's pages in the game's graphics, camera, HUD and audio menus. Off: stock menus, values saved earlier still apply. (0 = Off, 1 = On (Default))
StartupLocation = 1                // Startup location option (skip the car meet, spawn at the festival); chosen in the game's menu. (0 = Off, 1 = On (Default))
IneligibleCarDialogueSkip = 1      // Option to skip the "ineligible car" dialogue before races; chosen in the game's menu. (0 = Off, 1 = On (Default))
CarChangePosition = 1              // Option to place a changed car on the nearest road; chosen in the game's menu. (0 = Off, 1 = On (Default))
ShowAllRaces = 1                   // Option to play every one-off race from online in solo free roam; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))
CustomShowcases = 1                // Option to pick your own car for showcase events; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))
FreeRoamDrivatars = 1              // Option to turn off Drivatars in free roam; chosen in the game's difficulty menu. (0 = Off, 1 = On (Default))
PlayerCharacter = 1                // Option to pick your player model; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))

[Camera]
DriftCamera = 1                    // The drift camera; its options are in the game's camera menu. (0 = Off, 1 = On (Default))
FieldOfView = 1                    // Field of view sliders for every camera. (0 = Off, 1 = On (Default))

[HUD]
MinimapRotation = 1                // A minimap that can follow the camera; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))
Notifications = 1                  // Options to hide the wheelspin and skill point notifications and the skill counter's shake; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))
DisplayUnits = 1                   // Options for the power and spring stiffness units; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))
SpeedZoneVignette = 1              // Option to hide the extra vignette in speed zones; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))

[Audio]
Dialogue = 1                       // Options to silence Ashley in the garage and Ben in photo mode; chosen in the game's audio menu. (0 = Off, 1 = On (Default))
CheckpointSound = 1                // Option to mute the checkpoint sound; chosen in the game's audio menu. (0 = Off, 1 = On (Default))
MasterVolume = 1                   // A master volume slider, and every volume slider goes down to 0; in the game's audio menu. (0 = Off, 1 = On (Default))

[Vehicle]
HeadlightsToggle = 0               // Headlights on/off with the Headlights binding below. (0 = Off (Default), 1 = On)
RoofToggle = 0                     // Roof open/closed with a 1.5 second hold of the Roof binding while standing still in free roam, on cars that have one. (0 = Off (Default), 1 = On)
TurnSignals = 0                    // Turn signals (0.5 second hold) and hazard lights (tap) with the bindings below. (0 = Off (Default), 1 = On)

[Graphics]
SunShadows = 1                     // Smoother sun shadows; the quality is chosen in the game's graphics menu. (0 = Off, 1 = On (Default))

[Livery]
EnhancedLiveries = 1               // 4K liveries, intermediate MSAA and extra supersampling; chosen in the game's graphics menu. (0 = Off, 1 = On (Default))

[PhotoMode]
FreeCamera = 1                     // Removes the photo mode camera's collision and boundaries. (0 = Off, 1 = On (Default))
Supersampling = 1                  // Photo supersampling; the sample count is chosen in the game's menu. (0 = Off, 1 = On (Default))

[Autodrive]
Enabled = 0                        // Set a GPS route in free roam, press the Autodrive binding and the game drives you there. The binding again, CancelAutodrive, driving yourself, pausing or arriving gives control back. Also the option to use it in races and head-to-heads, in the game's HUD menu. (0 = Off (Default), 1 = On)

[Compatibility]
DisableParentalLocks = 1           // Allows user-created content privilege checks locally. (0 = Off, 1 = On (Default))
DisableAzimuthSaveChecksums = 1    // Skips Azimuth's save hash and size checks and rebuilds missing commit markers, so liveries and vinyls are easier to add. Azimuth's folder layout still applies. (0 = Off, 1 = On (Default))

[Files]
EnableMediaOverrides = 0           // Loads loose assets beside the game EXE: mediaoverride > mediapc > mods > media. Example: media/Camera.zip/CameraGroups.xml becomes mediaoverride/Camera/CameraGroups.xml. Restart after changes. Add-on mods in the mods folder beside azimuth.exe load either way. (0 = Off (Default), 1 = On)

[Bindings]
// Controller and keyboard bindings work together. None turns a binding off.
// Controller: DPadUp/Down/Left/Right, A, B, X, Y, LB, RB, LT, RT, View, Menu, LeftStick, RightStick; combine with +, for example LB+Y.
// Keyboard: A-Z, 0-9, F1-F24, arrows, Space, Enter, Escape, Tab, Backspace, Insert, Delete, Home, End, PageUp, PageDown, Shift, Ctrl, Alt, or a virtual-key code (0xNN).
AutodriveXbox = DPadDown
AutodriveKeyboard = F2
CancelAutodriveXbox = None
CancelAutodriveKeyboard = None
HeadlightsXbox = RightStick        // A tap. Shared with Roof: tap = headlights, hold = roof.
HeadlightsKeyboard = F3
RoofXbox = RightStick
RoofKeyboard = F4
SignalLeftXbox = DPadLeft          // A 0.5 second hold; a tap keeps the stock radio action.
SignalLeftKeyboard = None
SignalRightXbox = DPadRight
SignalRightKeyboard = None
HazardsXbox = DPadUp               // A tap. Shared with PhotoMode: a 1 second hold opens photo mode.
HazardsKeyboard = None
PhotoModeXbox = DPadUp
PhotoModeKeyboard = None
ShowroomPhotoXbox = View
ShowroomPhotoKeyboard = None
CarMeetPhotoXbox = X               // Photo mode from the car meet's car view (View stays Change Camera).
CarMeetPhotoKeyboard = None
ReturnToGarageXbox = X
ReturnToGarageKeyboard = None
JumpToManufacturerXbox = View
JumpToManufacturerKeyboard = Tab
RimJumpToManufacturerXbox = Y      // Rim style categories; View stays Setup Manager.
RimJumpToManufacturerKeyboard = Tab
ToggleUIXbox = None                // Hides the UI; opening the pause menu brings it back.
ToggleUIKeyboard = F1

[Experiments]
LocalDrivatarLiveries = 1          // Gives a random set of Drivatars your matching saved designs, prepared while the game loads. Restart after changing. (0 = Off, 1 = On (Default))
MaxDrivatarLiveries = 5            // How many Drivatars get one: 0-32; more uses more memory. Restart after changing.
UnlockAeroTuning = 0               // Front and rear aero tuning without Forza race bodywork. Forza aero ranges can change stock PI and handling. (0 = Off (Default), 1 = On)
AllEngineSwaps = 0                 // Every engine as a swap for every car, in a private runtime database. Longer first load, slow engine list. Keep on while you use a car saved with one of them. (0 = Off (Default), 1 = On)
AllTransmissionSwaps = 0           // Every gearbox for every car, with full ratio tuning. Longer first load, long list. Keep on while you use a car saved with one of them. Restart after changing. (0 = Off (Default), 1 = On)
