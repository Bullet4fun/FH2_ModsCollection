; Forza Horizon 2 Extra Options
; Release v0.2.98
; Compatible with Azimuth 0.9.10
; by Arthur (RokkuDayo)

; INI settings are read at game startup.
; Graphics, camera and HUD values are set in-game and saved to FH2_ExtraOptions.dat;
; the switches here decide whether those features exist at all: a feature switched off here is
; gone from the game's menus and its saved value is ignored.
; 0 = off, 1 = on. A key left out keeps its default.

[Global]
; Toggles the entire feature set of the mod on or off.
Enabled=1

[Content]
; Grants entitlements for all DLC content.
; Treasure Map and VIP DLCs have their own toggles below.
; The Storm Island map will not be accessible if you don't have the DLC package mounted, but its vehicles will be available regardless.
UnlockDLC=1

; Grants entitlement for VIP status and its perks.
; Double credits and XP rewards, and double bonus on wheelspins.
OfflineVIP=1

; Reveals all bonus boards and barn locations on the mainland and Storm Island.
; Also enables the Treasure Map listing in the Extras menu of the Marketplace tab while offline.
; Important: Enabling this, entering the game, saving, disabling this, and then entering the game again will keep all boards discovered.
UnlockTreasureMap=0

; Bypasses Storm Island event requirements for purchasing the Ranger T6 and #7 SST.
UnlockStormIslandCars=1

[Frontend]
; Boots straight into the "Press Start" menu.
SkipIntro=1

; Enables the "Get In Car" feature during free-roam.
; You can find it by selecting any car in the "My Cars" section of the pause menu.
GetInCarFromPauseMenu=1

; The "Return to Garage" button in the pause menu.
ReturnToGarage=1

; Adds combined aftermarket and stock-rim library categories after the three original rim categories.
; Does not change the game database.
AllRimsCategory=0

; Enables tabs in the pause menu that require an XBOX Live connection.
EnableMarketplace=1
EnableSocial=1
EnableClubs=1
EnableRivals=1

; The mod's pages in the game's settings menus (graphics, camera and HUD options).
; Off: the menus are stock; values saved earlier in FH2_ExtraOptions.dat still apply.
InGameOptions=1

; Features whose value is chosen in the game's menus. 0: off, and gone from the menu.
; Startup location (skip the car meet, spawn at the festival).
StartupLocation=1
; Skipping the "ineligible car" dialogue before races.
IneligibleCarDialogueSkip=1
; Placing a changed car on the nearest road.
CarChangePosition=1

[Camera]
; The drift camera (its options are in the game's camera menu).
DriftCamera=1

; Field of view sliders for every camera.
FieldOfView=1

[HUD]
; The minimap that can follow the camera (follow or not is chosen in the game's HUD menu).
MinimapRotation=1

[Vehicle]
; Click the right stick: headlights on/off.
HeadlightsToggle=1

; Hold the right stick for two seconds while standing still: roof open/closed, on cars that have one.
RoofToggle=1

; Hold D-pad left/right for a second: turn signals. Tap D-pad up: hazard lights.
TurnSignals=1

; Aero tuning without equipping Forza Aero parts.
AeroTuning=1

[Graphics]
; Smoother sun shadows (the quality is chosen in the game's graphics menu).
SunShadows=1

[Livery]
; 4K liveries, intermediate MSAA and extra supersampling (chosen in the game's graphics menu).
EnhancedLiveries=1

[PhotoMode]
; Removes the camera collision detection and boundaries in photo mode.
FreeCamera=1

; Photo mode supersampling (the sample count is chosen in the game's menu).
Supersampling=1

[Autodrive]
; Allows you to set a GPS route in free roam and then press F2 or D-pad Down to have the game drive you there.
; Pressing F2/D-pad Down again, steering, accelerating, braking, pausing or arriving restores player control.
Enabled=0

[Profile]
; Uses the Gamerpic.png beside this INI file as the player's avatar.
; Maximum supported dimensions are 2048x2048 and a maximum file size of 16 MB. Square PNG recommended.
CustomGamerpic=1

[Compatibility]
; Allow user-created content privilege checks locally.
DisableParentalLocks=1

; Skips Azimuth's save data blob hash and file size comparisons, and rebuilds missing commit markers at startup.
; You still need to follow Azimuth's custom directory structure, but this should make it easier to add new liveries and vinyls to your save.
DisableAzimuthSaveChecksums=1

[Files]
; Loose assets beside the game EXE.
; The priority goes: mediaoverride > mediapc > original media.
; Example: media/Camera.zip/CameraGroups.xml becomes mediaoverride/Camera/CameraGroups.xml.
; Restart the game after changing files.
EnableMediaOverrides=0
