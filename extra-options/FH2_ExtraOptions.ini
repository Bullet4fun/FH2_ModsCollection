// Forza Horizon 2 Extra Options
// Release v0.2.98, compatible with Azimuth 0.9.10
// by Arthur (RokkuDayo): https://github.com/RokkuDayo/ForzaHorizon2_ExtraOptions
// Fork by Bullet4fun for FH2 Mod Loader compatibility: https://github.com/Bullet4fun/FH2_ModsCollection
//
// Read at game startup. A key left out keeps its default.
// Graphics, camera and HUD values are set in-game and saved to FH2_ExtraOptions.dat; the switches here decide
// whether those features exist at all: a feature switched off here is gone from the game's menus and its saved value is ignored.

[Global]
Enabled = 1                        // Turns every feature of the mod on or off. (0 = Off, 1 = On (Default))

[Content]
UnlockDLC = 1                      // Grants all DLC entitlements. Storm Island's map needs its DLC package mounted; its cars work regardless. (0 = Off, 1 = On (Default))
OfflineVIP = 1                     // Grants VIP status: double credits, XP and wheelspin bonuses. (0 = Off, 1 = On (Default))
UnlockTreasureMap = 0              // Reveals all bonus boards and barns (mainland and Storm Island) and lists the Treasure Map in Marketplace > Extras offline. Boards found while on stay found after a save. (0 = Off (Default), 1 = On)
UnlockStormIslandCars = 1          // Lets you buy the Ranger T6 and #7 SST without the Storm Island events. (0 = Off, 1 = On (Default))

[Frontend]
SkipIntro = 1                      // Boots straight into the "Press Start" menu. (0 = Off, 1 = On (Default))
GetInCarFromPauseMenu = 1          // "Get In Car" in free roam: pick any car in the pause menu's My Cars. (0 = Off, 1 = On (Default))
ReturnToGarage = 1                 // The "Return to Garage" button in the pause menu. (0 = Off, 1 = On (Default))
AllRimsCategory = 0                // Adds combined aftermarket and stock rim categories after the three stock ones. The game database is not changed. (0 = Off (Default), 1 = On)
EnableMarketplace = 1              // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
EnableSocial = 1                   // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
EnableClubs = 1                    // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
EnableRivals = 1                   // Pause menu tab that needs Xbox Live. (0 = Off, 1 = On (Default))
InGameOptions = 1                  // The mod's pages in the game's graphics, camera and HUD menus. Off: stock menus, values saved earlier still apply. (0 = Off, 1 = On (Default))
StartupLocation = 1                // Startup location option (skip the car meet, spawn at the festival); chosen in the game's menu. (0 = Off, 1 = On (Default))
IneligibleCarDialogueSkip = 1      // Option to skip the "ineligible car" dialogue before races; chosen in the game's menu. (0 = Off, 1 = On (Default))
CarChangePosition = 1              // Option to place a changed car on the nearest road; chosen in the game's menu. (0 = Off, 1 = On (Default))

[Camera]
DriftCamera = 1                    // The drift camera; its options are in the game's camera menu. (0 = Off, 1 = On (Default))
FieldOfView = 1                    // Field of view sliders for every camera. (0 = Off, 1 = On (Default))

[HUD]
MinimapRotation = 1                // A minimap that can follow the camera; chosen in the game's HUD menu. (0 = Off, 1 = On (Default))

[Vehicle]
HeadlightsToggle = 0               // Click the right stick: headlights on/off. (0 = Off (Default), 1 = On)
RoofToggle = 0                     // Hold the right stick for two seconds while standing still: roof open/closed, on cars that have one. (0 = Off (Default), 1 = On)
TurnSignals = 0                    // Hold D-pad left/right for a second: turn signals. Tap D-pad up: hazard lights. (0 = Off (Default), 1 = On)
AeroTuning = 0                     // Aero tuning without Forza Aero parts. (0 = Off (Default), 1 = On)

[Graphics]
SunShadows = 1                     // Smoother sun shadows; the quality is chosen in the game's graphics menu. (0 = Off, 1 = On (Default))

[Livery]
EnhancedLiveries = 1               // 4K liveries, intermediate MSAA and extra supersampling; chosen in the game's graphics menu. (0 = Off, 1 = On (Default))

[PhotoMode]
FreeCamera = 1                     // Removes the photo mode camera's collision and boundaries. (0 = Off, 1 = On (Default))
Supersampling = 1                  // Photo supersampling; the sample count is chosen in the game's menu. (0 = Off, 1 = On (Default))

[Autodrive]
Enabled = 0                        // Set a GPS route in free roam, press F2 or D-pad Down and the game drives you there. F2/D-pad Down again, steering, throttle, brake, pause or arriving gives control back. (0 = Off (Default), 1 = On)

[Profile]
CustomGamerpic = 1                 // Uses Gamerpic.png beside this INI as your avatar. Up to 2048x2048 and 16 MB; square PNG recommended. (0 = Off, 1 = On (Default))

[Compatibility]
DisableParentalLocks = 1           // Allows user-created content privilege checks locally. (0 = Off, 1 = On (Default))
DisableAzimuthSaveChecksums = 1    // Skips Azimuth's save hash and size checks and rebuilds missing commit markers, so liveries and vinyls are easier to add. Azimuth's folder layout still applies. (0 = Off, 1 = On (Default))

[Files]
EnableMediaOverrides = 0           // Loads loose assets beside the game EXE: mediaoverride > mediapc > media. Example: media/Camera.zip/CameraGroups.xml becomes mediaoverride/Camera/CameraGroups.xml. Restart after changes. (0 = Off (Default), 1 = On)
